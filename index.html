<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NATAZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03030a;
    cursor: none;
  }

  /* Nebula galaksi */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 45% at 20% 25%, rgba(110, 40, 200, 0.28), transparent 70%),
      radial-gradient(ellipse 55% 50% at 80% 70%, rgba(0, 120, 255, 0.22), transparent 70%),
      radial-gradient(ellipse 40% 35% at 55% 45%, rgba(255, 60, 170, 0.14), transparent 70%),
      radial-gradient(ellipse at center, #070718 0%, #02020a 100%);
    animation: nebula 18s ease-in-out infinite alternate;
  }

  @keyframes nebula {
    from { transform: scale(1) rotate(0deg); }
    to   { transform: scale(1.12) rotate(3deg); }
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .content {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(3.5rem, 17vw, 13rem);
    letter-spacing: 0.18em;
    margin-right: -0.18em; /* kompensasi letter-spacing agar tetap center */
    background: linear-gradient(120deg, #ffffff 0%, #b9a6ff 30%, #5cc8ff 55%, #ff7ad9 80%, #ffffff 100%);
    background-size: 250% 250%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 7s linear infinite, glow 4s ease-in-out infinite alternate;
    user-select: none;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 250% 50%; }
  }

  @keyframes glow {
    from { filter: drop-shadow(0 0 12px rgba(140, 120, 255, 0.55)) drop-shadow(0 0 40px rgba(80, 160, 255, 0.25)); }
    to   { filter: drop-shadow(0 0 22px rgba(255, 120, 220, 0.6)) drop-shadow(0 0 70px rgba(120, 100, 255, 0.4)); }
  }

  .tagline {
    margin-top: 1.2rem;
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.7rem, 1.6vw, 1rem);
    letter-spacing: 0.7em;
    margin-right: -0.7em;
    color: rgba(190, 200, 255, 0.55);
    text-transform: uppercase;
  }

  /* Kursor custom */
  .cursor {
    position: fixed;
    top: 0; left: 0;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 14px 4px rgba(150, 170, 255, 0.8);
    z-index: 3;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 60px; height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    border: 1px solid rgba(160, 180, 255, 0.35);
    z-index: 3;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="content">
  <h1>NATAZ</h1>
  <p class="tagline">· beyond the stars ·</p>
</div>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="ring"></div>

<script>
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const cursorEl = document.getElementById('cursor');
  const ringEl = document.getElementById('ring');

  let W, H, stars = [];
  const mouse = { x: -9999, y: -9999, active: false };
  let ringX = 0, ringY = 0;

  const COLORS = ['255,255,255', '190,200,255', '160,220,255', '255,190,240'];

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
  }

  function initStars() {
    const count = Math.min(900, Math.floor((W * H) / 2200));
    stars = [];
    for (let i = 0; i < count; i++) {
      const x = Math.random() * W;
      const y = Math.random() * H;
      stars.push({
        hx: x, hy: y,          // posisi asal
        x, y,
        vx: 0, vy: 0,
        r: Math.random() * 1.5 + 0.3,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        tw: Math.random() * Math.PI * 2,
        twSpeed: 0.01 + Math.random() * 0.03,
        depth: Math.random() * 0.8 + 0.2,
        drift: Math.random() * Math.PI * 2
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    const RADIUS = 260;

    for (const s of stars) {
      // gerak melayang pelan
      s.drift += 0.002;
      const homeX = s.hx + Math.cos(s.drift) * 6 * s.depth;
      const homeY = s.hy + Math.sin(s.drift) * 6 * s.depth;

      // tarik kembali ke posisi asal (pegas lembut)
      s.vx += (homeX - s.x) * 0.0035;
      s.vy += (homeY - s.y) * 0.0035;

      // tertarik ke kursor
      if (mouse.active) {
        const dx = mouse.x - s.x;
        const dy = mouse.y - s.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < RADIUS && dist > 1) {
          const force = (1 - dist / RADIUS) * 0.5 * s.depth;
          s.vx += (dx / dist) * force;
          s.vy += (dy / dist) * force;
        }
      }

      s.vx *= 0.93;
      s.vy *= 0.93;
      s.x += s.vx;
      s.y += s.vy;

      // kedip
      s.tw += s.twSpeed;
      const alpha = 0.45 + Math.sin(s.tw) * 0.4 + 0.15;

      // titik makin terang & besar saat dekat kursor
      let size = s.r;
      let a = Math.max(0.1, Math.min(1, alpha));
      if (mouse.active) {
        const d = Math.hypot(mouse.x - s.x, mouse.y - s.y);
        if (d < RADIUS) {
          const k = 1 - d / RADIUS;
          size += k * 1.2;
          a = Math.min(1, a + k * 0.5);
        }
      }

      ctx.beginPath();
      ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.color},${a})`;
      ctx.shadowBlur = size * 5;
      ctx.shadowColor = `rgba(${s.color},0.8)`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // cincin kursor mengikuti dengan delay halus
    ringX += (mouse.x - ringX) * 0.15;
    ringY += (mouse.y - ringY) * 0.15;
    ringEl.style.transform = `translate(${ringX}px, ${ringY}px)`;

    requestAnimationFrame(animate);
  }

  function setPointer(x, y) {
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
    cursorEl.style.transform = `translate(${x}px, ${y}px)`;
  }

  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    setPointer(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    setPointer(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('mouseleave', () => { mouse.active = false; });
  window.addEventListener('resize', resize);

  resize();
  animate();
</script>
</body>
</html>
